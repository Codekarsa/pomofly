<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#3b82f6"/>
  
  <!-- Timer Circle -->
  <circle cx="300" cy="315" r="120" fill="#ffffff" stroke="#e5e7eb" stroke-width="6"/>
  
  <!-- Timer Progress (25 minutes example) -->
  <circle cx="300" cy="315" r="120" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="754" stroke-dashoffset="188" transform="rotate(-90 300 315)"/>
  
  <!-- Clock Center -->
  <circle cx="300" cy="315" r="10" fill="#374151"/>
  
  <!-- Clock Hands -->
  <line x1="300" y1="315" x2="300" y2="240" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="300" y1="315" x2="360" y2="315" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  
  <!-- App Name and Tagline -->
  <text x="600" y="270" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="700" fill="#ffffff">POMOFLY</text>
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="400" fill="#ffffff" opacity="0.9">Elegant Pomodoro Timer &amp; Task Manager</text>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#ffffff" opacity="0.8">Boost productivity with focused 25-minute sessions</text>
</svg>
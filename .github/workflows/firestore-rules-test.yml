name: Test Firestore Security Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-security-rules:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Install Firebase CLI and Rules Testing
        run: |
          npm install -g firebase-tools
          yarn add --dev @firebase/rules-unit-testing
      
      - name: Start Firebase Emulator
        run: firebase emulators:start --only firestore --project demo-test &
        env:
          FIREBASE_PROJECT: demo-test
      
      - name: Wait for emulator to start
        run: |
          timeout 30 bash -c 'until printf "" 2>>/dev/null >>/dev/tcp/localhost/8080; do sleep 1; done'
      
      - name: Run Firestore Rules Tests
        run: yarn test tests/firestore.rules.test.ts
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_PROJECT: demo-test
      
      - name: Stop Firebase Emulator
        run: firebase emulators:stop
        if: always()
      
      - name: Validate Firestore Rules Syntax
        run: firebase firestore:rules:test --project demo-test
        env:
          FIREBASE_PROJECT: demo-test
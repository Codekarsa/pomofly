name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 6 AM UTC
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write
  checks: write
  pull-requests: write

jobs:
  # CodeQL static analysis for security vulnerabilities
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'typescript' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config: |
            paths:
              - src
              - pages
            paths-ignore:
              - node_modules
              - .next
              - out
              - coverage
            queries:
              - uses: security-and-quality
              - uses: security-extended

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-for-build"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy-for-build"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy-for-build"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dummy-for-build"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "dummy-for-build"
          NEXT_PUBLIC_FIREBASE_APP_ID: "dummy-for-build"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Dependency vulnerability scanning
  dependency-scanning:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      # GitHub Dependency Review (for PRs)
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
      
      # NPM audit for vulnerabilities
      - name: NPM Security Audit
        run: |
          # Run npm audit and capture output
          if ! yarn audit --level moderate --groups dependencies; then
            echo "::error::High or critical vulnerabilities found in dependencies"
            yarn audit --level moderate --groups dependencies --json > audit-results.json || true
            echo "audit_failed=true" >> $GITHUB_ENV
          else
            echo "audit_failed=false" >> $GITHUB_ENV
          fi
      
      # Snyk vulnerability scanning (if token available)
      - name: Snyk Security Scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable
      
      # Upload audit results as artifact
      - name: Upload audit results
        if: env.audit_failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
      
      # Fail the job if high/critical vulnerabilities found
      - name: Security Gate
        if: env.audit_failed == 'true'
        run: |
          echo "::error::Security gate failed: High or critical vulnerabilities detected"
          echo "Please review and fix the vulnerabilities before merging"
          exit 1

  # Secret scanning simulation (enhanced)
  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comprehensive scanning
      
      # GitLeaks for secret detection
      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
      # Custom secret patterns for common API keys
      - name: Custom Secret Patterns
        run: |
          echo "Scanning for custom secret patterns..."
          
          # Define patterns for common secrets
          FIREBASE_KEY_PATTERN="AIza[0-9A-Za-z\\-_]{35}"
          ANTHROPIC_KEY_PATTERN="sk-ant-api03-[A-Za-z0-9\\-_]{95}"
          OPENAI_KEY_PATTERN="sk-[A-Za-z0-9]{48}"
          GENERAL_API_PATTERN="['\"][A-Za-z0-9]{20,}['\"]"
          
          # Scan source files for potential secrets
          SECRET_FOUND=false
          
          if grep -r -E "$FIREBASE_KEY_PATTERN" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
            echo "::error::Potential Firebase API key found in source code"
            SECRET_FOUND=true
          fi
          
          if grep -r -E "$ANTHROPIC_KEY_PATTERN" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
            echo "::error::Potential Anthropic API key found in source code"
            SECRET_FOUND=true
          fi
          
          if grep -r -E "$OPENAI_KEY_PATTERN" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null; then
            echo "::error::Potential OpenAI API key found in source code"
            SECRET_FOUND=true
          fi
          
          # Check for hardcoded credentials in config files
          if grep -r -i "password\|secret\|key" --include="*.json" --include="*.yaml" --include="*.yml" . | grep -v node_modules | grep -v ".git" | grep -E "['\"][^'\"]*['\"].*['\"][A-Za-z0-9]{10,}['\"]"; then
            echo "::warning::Potential hardcoded credentials found in config files"
          fi
          
          if [ "$SECRET_FOUND" = true ]; then
            echo "::error::Secrets detected! Please remove them and use environment variables instead."
            exit 1
          else
            echo "✓ No secrets detected in source code"
          fi

  # License compliance check
  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      # License checker
      - name: Check License Compatibility
        run: |
          # Install license-checker
          npm install -g license-checker
          
          # Check for incompatible licenses
          echo "Checking license compatibility..."
          
          # Generate license report
          license-checker --production --json > licenses.json
          
          # Check for GPL and other copyleft licenses that might be incompatible
          INCOMPATIBLE_LICENSES="GPL-2.0 GPL-3.0 AGPL LGPL"
          FOUND_INCOMPATIBLE=false
          
          for license in $INCOMPATIBLE_LICENSES; do
            if license-checker --production --onlyAllow "NOT $license" > /dev/null 2>&1; then
              continue
            else
              echo "::warning::Found potentially incompatible license: $license"
              FOUND_INCOMPATIBLE=true
            fi
          done
          
          # Generate summary report
          echo "## License Summary" > license-report.md
          echo "" >> license-report.md
          license-checker --production --summary >> license-report.md
          
          if [ "$FOUND_INCOMPATIBLE" = true ]; then
            echo "::warning::Please review license compatibility with legal team"
          else
            echo "✓ No incompatible licenses detected"
          fi
      
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: |
            licenses.json
            license-report.md

  # Security summary report
  security-report:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [codeql-analysis, dependency-scanning, secret-scanning, license-compliance]
    if: always()
    
    steps:
      - name: Generate Security Summary
        run: |
          echo "# Security Scan Results" > security-summary.md
          echo "" >> security-summary.md
          echo "| Check | Status |" >> security-summary.md
          echo "|-------|--------|" >> security-summary.md
          
          if [ "${{ needs.codeql-analysis.result }}" = "success" ]; then
            echo "| CodeQL Analysis | ✅ Passed |" >> security-summary.md
          else
            echo "| CodeQL Analysis | ❌ Failed |" >> security-summary.md
          fi
          
          if [ "${{ needs.dependency-scanning.result }}" = "success" ]; then
            echo "| Dependency Scanning | ✅ Passed |" >> security-summary.md
          else
            echo "| Dependency Scanning | ❌ Failed |" >> security-summary.md
          fi
          
          if [ "${{ needs.secret-scanning.result }}" = "success" ]; then
            echo "| Secret Detection | ✅ Passed |" >> security-summary.md
          else
            echo "| Secret Detection | ❌ Failed |" >> security-summary.md
          fi
          
          if [ "${{ needs.license-compliance.result }}" = "success" ]; then
            echo "| License Compliance | ✅ Passed |" >> security-summary.md
          else
            echo "| License Compliance | ⚠️ Warning |" >> security-summary.md
          fi
          
          echo "" >> security-summary.md
          echo "View detailed results in the [Security tab](https://github.com/${{ github.repository }}/security)" >> security-summary.md
          
          cat security-summary.md
      
      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

  # Notify on security failures (for main branch)
  notify-security-failure:
    name: Notify Security Failure
    runs-on: ubuntu-latest
    needs: [codeql-analysis, dependency-scanning, secret-scanning]
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Create Security Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Security Scan Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## ⚠️ Security Scan Failure Alert
            
            A security scan has failed on the main branch. Please review and address the issues:
            
            **Failed Checks:**
            - CodeQL Analysis: ${{ needs.codeql-analysis.result }}
            - Dependency Scanning: ${{ needs.dependency-scanning.result }}  
            - Secret Detection: ${{ needs.secret-scanning.result }}
            
            **Action Required:**
            1. Review the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Address any high/critical vulnerabilities
            3. Verify no secrets are committed
            4. Re-run security scans
            
            This issue will be automatically closed when security scans pass.
            `;
            
            // Create issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'critical', 'automated']
            });